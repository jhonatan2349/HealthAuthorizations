# Entorno local completo:  docker compose up -d --build
#   API ............ http://localhost:8080/scalar   (token: POST /api/v1/auth/token, usuarios demo abajo)
#   RabbitMQ ....... http://localhost:15672
#   Aspire (OTel) .. http://localhost:18888
# Solo dependencias, para correr la API con "dotnet run":  docker compose up -d sqlserver rabbitmq redis aspire-dashboard
# Las credenciales salen de .env (ver .env.example).

# Cadena de conexión compartida por el migrador y la API.
x-sql-connection: &sql-connection "Server=sqlserver;Database=HealthAuthorizations;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"

# Endurecimiento común de los contenedores propios: sistema de archivos de solo lectura, sin capacidades
# de Linux ni escalamiento de privilegios. Las imágenes ya corren con un usuario no root.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: healthauth-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # Broker de eventos. Consola de administración: http://localhost:15672
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: healthauth-rabbitmq
    # RabbitMQ guarda los datos en una carpeta con el nombre del nodo (rabbit@<hostname>). Sin hostname fijo,
    # cada contenedor nuevo (docker compose down/up) usa otro nombre y no encuentra colas ni exchanges previos.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # consola web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Caché distribuida (L2 de HybridCache). Solo en localhost; en ambientes reales con contraseña y TLS.
  redis:
    image: redis:7.4-alpine
    container_name: healthauth-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Visor local de OpenTelemetry (trazas, métricas y logs). UI: http://localhost:18888
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    container_name: healthauth-dashboard
    environment:
      # Solo para desarrollo local: sin login en el visor.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"   # interfaz web
      - "127.0.0.1:4317:18889"    # receptor OTLP/gRPC
    restart: unless-stopped

  # Aplica las migraciones pendientes y termina. La API no arranca hasta que este servicio finaliza con éxito.
  migrator:
    <<: *hardening
    build:
      context: .
      target: migrator
    image: healthauthorizations-migrator:local
    container_name: healthauth-migrator
    environment:
      ConnectionStrings__Default: *sql-connection
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    <<: *hardening
    build:
      context: .
      target: api
    image: healthauthorizations-api:local
    container_name: healthauth-api
    environment:
      # "Demo": no es Production, así se publican Scalar/OpenAPI y se permite el emisor de tokens de demostración.
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__Default: *sql-connection
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY en .env (ver .env.example)}"
      Mensajeria__Habilitada: "true"
      Mensajeria__RabbitMq__Host: rabbitmq
      Mensajeria__RabbitMq__Usuario: "${RABBITMQ_USER}"
      Mensajeria__RabbitMq__Clave: "${RABBITMQ_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      # Usuarios de demostración (solo este entorno local; el emisor está prohibido en Production).
      Auth__EmisorDemo__Habilitado: "true"
      Auth__EmisorDemo__Usuarios__0__Usuario: lector
      Auth__EmisorDemo__Usuarios__0__Nombre: "Usuario de consulta (demo)"
      Auth__EmisorDemo__Usuarios__0__Clave: Lector.Demo.2026
      Auth__EmisorDemo__Usuarios__0__Roles__0: autorizaciones.lector
      Auth__EmisorDemo__Usuarios__1__Usuario: operador
      Auth__EmisorDemo__Usuarios__1__Nombre: "Operador de autorizaciones (demo)"
      Auth__EmisorDemo__Usuarios__1__Clave: Operador.Demo.2026
      Auth__EmisorDemo__Usuarios__1__Roles__0: autorizaciones.operador
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    # Mayor que Resiliencia:TimeoutApagadoSegundos (25 s): deja terminar las solicitudes en curso tras SIGTERM.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data: